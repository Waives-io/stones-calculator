<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מחשבון האבנים הקטנות · WAIVES</title>
<meta name="description" content="כמה שעות בחודש חוזרות לצוות כשהמשימות הקטנות נעשות לבד.">
<meta name="theme-color" content="#14707E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WAIVES Waterline Light — the token values are fixed.
   ============================================================ */
:root{
  --white:#FFFFFF; --ink:#1B2436; --deep:#04091A; --mute:#54637C;
  --teal:#1A8FA0; --teal-ink:#14707E; --gold:#C9A84C; --gold-dark:#A07830;
  --panel:#F5F7FA; --line:#E3E8EF;
  --bar:72px;            /* bottom navigation */
  --sheet-max:560px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  background:var(--panel); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{
  position:sticky; top:0; z-index:30;
  background:var(--teal-ink); color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; gap:10px;
  box-shadow:0 1px 0 rgba(0,0,0,.08);
}
.top .brand{display:flex;align-items:center;gap:8px;min-width:0}
.top .mark{width:20px;height:20px;flex:none}
.top h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.icobtn{
  background:rgba(255,255,255,.14); border:0; color:#fff;
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
}
.icobtn:hover{background:rgba(255,255,255,.24)}
.newbtn{
  background:var(--gold); color:var(--deep); border:0; font-weight:700;
  height:38px; padding:0 14px; border-radius:11px; display:flex; align-items:center; gap:6px; flex:none;
}
.newbtn:hover{background:#d8ba63}

/* ---------- page frame ---------- */
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card + .card{margin-top:14px}
.cardhead{
  padding:14px 16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:8px;
}
.cardhead h2{margin:0;font-size:15px;font-weight:700}
.cardhead .sub{font-size:12.5px;color:var(--mute)}

/* ---------- the list ---------- */
.row{
  display:flex;align-items:center;gap:12px;width:100%;
  background:#fff;border:0;border-bottom:1px solid var(--line);
  padding:12px 14px;text-align:start;
}
.row:last-of-type{border-bottom:0}
.row:hover{background:#FBFCFE}
.row.off .nm,.row.off .hrs{opacity:.42}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:19px;height:19px}
.rowmain{flex:1;min-width:0}
.nm{font-weight:600;font-size:15px;line-height:1.3;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;font-size:12px;color:var(--mute);margin-top:2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrs{font-weight:700;font-size:15px;color:var(--teal-ink);flex:none;white-space:nowrap}
.row.off .hrs{color:var(--mute);text-decoration:line-through}
.tick{
  width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
  background:#fff;flex:none;display:grid;place-items:center;padding:0;
}
.tick[aria-checked="true"]{background:var(--teal);border-color:var(--teal)}
.tick svg{width:15px;height:15px;color:#fff;opacity:0}
.tick[aria-checked="true"] svg{opacity:1}

/* ---------- cart total ---------- */
.total{
  background:var(--deep);color:#fff;padding:16px;
  display:flex;align-items:center;gap:14px;
}
.total .lbl{font-size:13px;color:#C7D0DD;font-weight:500}
.total .big{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.5px}
.total .unit{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:3px}
.total .grow{flex:1}
.total .free{font-size:12.5px;color:#C7D0DD;margin-top:7px;line-height:1.45}

/* ---------- empty state ---------- */
.empty{padding:34px 20px;text-align:center}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 18px;color:var(--mute);font-size:13.5px;line-height:1.6}
.btn{
  background:var(--teal);color:#fff;border:0;border-radius:12px;
  padding:12px 20px;font-weight:700;font-size:15px;
}
.btn:hover{background:var(--teal-ink)}
.btn.ghost{background:#fff;color:var(--teal-ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--panel)}
.btn.block{display:block;width:100%}
.btn.gold{background:var(--gold);color:var(--deep)}
.btn.gold:hover{background:#d8ba63}

/* ---------- discovery questions ---------- */
.disc{margin-top:14px}
.disc summary{
  list-style:none;cursor:pointer;color:var(--teal-ink);font-weight:600;font-size:13.5px;
  padding:10px 2px;
}
.disc summary::-webkit-details-marker{display:none}
.disc ul{margin:4px 0 0;padding:0 18px 0 0}
.disc li{color:var(--mute);font-size:13px;line-height:1.75}

/* ---------- bottom navigation ---------- */
nav.bar{
  position:fixed;inset-inline:0;bottom:0;z-index:30;
  background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav.bar button{
  flex:1;background:none;border:0;padding:10px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--mute);font-size:11.5px;font-weight:600;
}
nav.bar button svg{width:21px;height:21px}
nav.bar button[aria-current="page"]{color:var(--teal-ink)}
nav.bar .pill{font-size:11px;font-weight:700;background:var(--panel);
  border-radius:20px;padding:1px 7px;color:var(--ink)}

/* ---------- the sheet (new / edit item) ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,9,26,.55);z-index:40;display:grid;align-items:end}
.scrim[hidden]{display:none}
.sheet{
  background:#fff;width:100%;max-width:var(--sheet-max);margin:0 auto;
  border-radius:20px 20px 0 0;max-height:94vh;display:flex;flex-direction:column;
}
@media(min-width:700px){
  .scrim{align-items:center}
  .sheet{border-radius:20px;max-height:88vh}
}
.sheethead{
  background:var(--deep);color:#fff;padding:16px;border-radius:20px 20px 0 0;
  display:flex;align-items:center;gap:14px;flex:none;
}
.sheethead .t{font-size:13px;color:#C7D0DD;font-weight:600}
.sheethead .n{font-size:30px;font-weight:800;line-height:1.05}
.sheethead .u{font-size:12px;color:var(--gold);font-weight:700}
.sheetbody{padding:16px;overflow:auto;flex:1}
.sheetfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);display:flex;gap:10px;flex:none;background:#fff;
  border-radius:0 0 20px 20px}
.sheetfoot .btn{flex:1}

.q{margin-bottom:20px}
.q > label,.qlabel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-weight:700;font-size:14.5px;margin-bottom:9px}
.field{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--panel);font-size:16px;
}
.field:focus{background:#fff;border-color:var(--teal);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:#fff;border:1.5px solid var(--line);border-radius:11px;
  padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--ink);
}
.chip:hover{border-color:var(--teal)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.sm{padding:7px 11px;font-size:12.5px}
.freqbtn{
  background:var(--gold);border:0;color:var(--deep);border-radius:9px;
  padding:4px 10px;font-weight:700;font-size:14px;
}
.freqbtn:hover{background:#d8ba63}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.55}
.hint.warn{color:var(--gold-dark);font-weight:600}
.inline-link{background:none;border:0;color:var(--teal-ink);
  text-decoration:underline;font-size:13px;padding:4px 0;font-weight:600}

/* ---------- teams ---------- */
.team{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.team:last-child{border-bottom:0}
.team input[type=text]{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--panel);font-size:15px}
.team input[type=text]:focus{background:#fff;border-color:var(--teal);outline:none}
.stepper{display:flex;align-items:center;gap:2px;flex:none;
  border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{background:#fff;border:0;width:34px;height:38px;font-size:19px;font-weight:700;color:var(--teal-ink)}
.stepper button:hover{background:var(--panel)}
.stepper input{width:48px;height:38px;border:0;text-align:center;font-weight:700;font-size:15px;background:#fff}
.stepper input:focus{outline:none;background:var(--panel)}
.teamcount{font-size:12px;color:var(--mute);flex:none}

/* ---------- dashboard ---------- */
.dash-num{font-size:60px;font-weight:800;line-height:.95;color:var(--teal-ink);letter-spacing:-1.5px}
.dash-sub{color:var(--mute);font-size:14px;margin-top:8px;line-height:1.6}
.block{padding:18px 16px}
.block + .block{border-top:1px solid var(--line)}
.block h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--gold-dark)}
.posrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.person{width:34px;height:46px;flex:none;color:var(--gold)}
.posmore{font-size:13px;font-weight:700;color:var(--gold-dark)}
.poscap{margin-top:10px;font-size:13px;color:var(--mute);line-height:1.6}
.poscap b{color:var(--gold-dark)}
.bar-item{margin-bottom:13px}
.bar-item:last-child{margin-bottom:0}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.bar-top .v{font-weight:700;color:var(--teal-ink);flex:none}
.bar-track{height:9px;background:var(--panel);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--teal);border-radius:6px}
.bar-item.lead .bar-fill{background:var(--gold)}
.bar-item.lead .bar-top .v{color:var(--gold-dark)}

/* ---------- snackbar ---------- */
.snack{
  position:fixed;inset-inline:12px;bottom:calc(var(--bar) + 12px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;background:var(--deep);color:#fff;
  border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px;
  z-index:50;font-size:13.5px;box-shadow:0 10px 30px rgba(4,9,26,.3);
}
.snack[hidden]{display:none}
.snack .grow{flex:1}
.snack button{background:none;border:0;color:var(--gold);font-weight:700;font-size:13.5px}

/* ---------- menu ---------- */
.menu{
  position:fixed;z-index:45;top:calc(58px + env(safe-area-inset-top));inset-inline-end:12px;
  background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 14px 40px rgba(4,9,26,.18);min-width:210px;
}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:start;background:#fff;border:0;
  padding:13px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:var(--panel)}
.foot{margin-top:18px;font-size:11.5px;color:var(--mute);line-height:1.65;text-align:center}
</style>
</head>

<script>
/* ============================================================
   מחשבון האבנים הקטנות · WAIVES
   One file, no build step, no server. Seven sections:
     1 catalog + constants   2 model + validation   3 compute
     4 persist / encode      5 render               6 events    7 boot
   Rules that hold everywhere in this file:
     - user text is written with textContent, NEVER innerHTML;
     - every value that arrives from a link or from storage is clamped;
     - validation never throws;
     - nothing derived is stored: compute(state) is the single source.
   ============================================================ */

/* ============================================================
   1. CATALOG + CONSTANTS
   ============================================================ */
/* Galli's estimate, 2026-11-21: a 9-hour day, 20 working days a month.
   Weekly work is multiplied by calendar weeks (4.5) while daily work is
   multiplied by working days (20) — a month holds about four and a half
   weeks, but you only work twenty of their days. */
const FTE_MONTH = 180;      // hours in a full-time month (20 × 9)
const DAYS_MONTH = 20;
const WEEKS_MONTH = 4.5;
const DAY_HOURS = 9;

const FREQS = ['day','week','month','quarter'];
const FREQ_ONCE = {day:'פעם ביום', week:'פעם בשבוע', month:'פעם בחודש', quarter:'פעם ברבעון'};
const FREQ_SHORT = {day:'יומי', week:'שבועי', month:'חודשי', quarter:'רבעוני'};
const AUTOS = [0.25, 0.5, 0.7, 0.9];
const AUTO_LABEL = {0.9:'כמעט הכול', 0.7:'רוב', 0.5:'חצי', 0.25:'קצת'};
const TIME_KEYS = [15, 30, 45, 60, 120];

/* Six domains. Each row in the list wears its domain's colour, so a long
   list can be read at a glance without anyone having to pick an icon.
   The colours are WAIVES tokens only. */
const DOMAINS = [
  {name:'משאבי אנוש וגיוס',      color:'var(--teal)',      icon:'people'},
  {name:'כספים והנהלת חשבונות',  color:'var(--gold-dark)', icon:'doc'},
  {name:'רכש ותפעול',            color:'var(--teal-ink)',  icon:'box'},
  {name:'שירות, מכירות ושיווק',  color:'var(--gold)',      icon:'chat'},
  {name:'לוגיסטיקה',             color:'var(--mute)',      icon:'truck'},
  {name:'שירותי משרד',           color:'var(--deep)',      icon:'clip'}
];
const DOMAIN_FALLBACK = {color:'var(--mute)', icon:'dot'};

const CATALOG = [
 {domain:'משאבי אנוש וגיוס', q:'באיזה שלב בגיוס או בקליטה הכי הרבה הלוך-חזור?', roles:[
   {role:'רכזת גיוס', tasks:[
     ['מיון קורות חיים',120,'day'],

     ['פרסום משרות בכמה ערוצים',60,'week'],
     ['עדכון סטטוס מועמדים בטבלה או במערכת',30,'day'],
     ['דוח גיוס להנהלה',120,'month']]},
   {role:'מנהלת משאבי אנוש', tasks:[
     ['קליטת עובד חדש (טפסים, הרשאות, ציוד)',180,'week'],
     ['מענה לשאלות חוזרות של עובדים',60,'day'],
     ['ריכוז נוכחות וחופשות לשכר',240,'month'],
     ['הכנת מסמכים ואישורים לעובדים',30,'day'],
     ['ריכוז תהליך הערכות עובדים',600,'quarter'],
     ['עזיבת עובד (סגירת הרשאות, ציוד, מסמכים)',120,'month']]}]},
 {domain:'כספים והנהלת חשבונות', q:'אילו מסמכים או אישורים אתה רודף אחריהם כל חודש?', roles:[
   {role:'מנהלת חשבונות', tasks:[
     ['הקלדת חשבוניות ספקים',90,'day'],
     ['התאמות בנק',180,'week'],
     ['גבייה ותזכורות ללקוחות',60,'day'],
     ['הפקת חשבוניות ללקוחות',45,'day'],
     ['איסוף מסמכים חסרים מעובדים ומספקים',30,'day'],
     ['הכנת חומרים לרואה החשבון',360,'quarter']]},
   {role:'כספים ובקרה', tasks:[
     ['דוח תזרים שבועי',120,'week'],
     ['דוח הנהלה חודשי',360,'month'],
     ['אישור והעברת תשלומים',60,'week'],
     ['הכנת תקציב רבעוני',720,'quarter']]}]},
 {domain:'רכש ותפעול', q:'איזה מידע אתה אוסף מכמה מקומות כדי להכין דוח או הזמנה?', roles:[
   {role:'רכזת רכש', tasks:[
     ['בקשה והשוואה של הצעות מחיר',120,'week'],
     ['פתיחת הזמנות רכש',30,'day'],
     ['מעקב אספקות מול ספקים',45,'day'],
     ['התאמת חשבונית להזמנה ולתעודת משלוח',30,'day'],
     ['עדכון מחירונים',180,'month'],
     ['הערכת ספקים',360,'quarter']]},
   {role:'מנהלת תפעול', tasks:[
     ['דוח סטטוס שבועי מכמה מקורות',120,'week'],
     ['העברת מידע בין מערכות (העתק-הדבק)',60,'day'],
     ['תיאום משימות ומעקב מול צוותים',45,'day'],
     ['ריכוז תקלות ובקשות',30,'day']]}]},
 {domain:'שירות, מכירות ושיווק', q:'מה אתה מעדכן אחרי כל שיחה או פגישה?', roles:[
   {role:'נציגת שירות', tasks:[
     ['מענה לשאלות חוזרות במייל ובוואטסאפ',120,'day'],
     ['תיעוד פניות במערכת',45,'day'],
     ['ניתוב פניות לגורם הנכון',30,'day'],
     ['סיכום שיחות',30,'day'],
     ['דוח פניות שבועי',60,'week']]},
   {role:'איש מכירות', tasks:[
     ['עדכון CRM אחרי פגישות ושיחות',45,'day'],
     ['הכנת הצעת מחיר',60,'week'],
     ['פולואפ ללידים',60,'day'],
     ['הכנה לפגישה (מחקר על הלקוח)',30,'day'],
     ['דוח מכירות',120,'week']]},
   {role:'רכזת שיווק', tasks:[
     ['הכנת פוסטים ותזמונם',180,'week'],
     ['איסוף נתוני קמפיינים לדוח',120,'week'],
     ['עדכון רשימות תפוצה',60,'week'],
     ['הכנת ניוזלטר',240,'month']]}]},
 {domain:'לוגיסטיקה', q:'מה לקוחות או ספקים שואלים אותך שהתשובה עליו כבר קיימת במערכת?', roles:[
   {role:'רכזת לוגיסטיקה', tasks:[
     ['תיאום משלוחים מול מובילים',60,'day'],
     ['הפקת תעודות משלוח ומסמכים',45,'day'],
     ['מענה ללקוחות "איפה ההזמנה שלי"',60,'day'],
     ['עדכון מלאי',30,'day'],
     ['ספירת מלאי',960,'quarter']]},
   {role:'מנהלת מחסן', tasks:[
     ['תכנון ליקוטים',45,'day'],
     ['דוח החזרות',120,'week'],
     ['הזמנה חוזרת של מלאי',60,'week']]}]},
 {domain:'שירותי משרד', q:'מה אתה מתאם בטלפון או בוואטסאפ שהיה יכול לקרות לבד?', roles:[
   {role:'מנהלת משרד', tasks:[
     ['ניהול יומנים ותיאום פגישות',60,'day'],
     ['הזמנת ציוד וכיבוד',60,'week'],
     ['מענה לטלפונים ולמיילים כלליים',60,'day'],
     ['סריקה ותיוק מסמכים',30,'day'],
     ['ריכוז נוכחות',120,'month'],
     ['ארגון אירועי חברה',480,'quarter']]},
   {role:'עוזרת אישית', tasks:[
     ['הכנת סיכומי ישיבות',30,'day'],
     ['תיאום נסיעות',120,'month'],
     ['מעקב משימות פתוחות של המנהל',30,'day']]}]}
];

/* The ready-made keys inside the form: name, minutes, frequency, domain index. */
const QUICK = [
  ['מיון קורות חיים',120,'day',0],
  ['הקלדת חשבוניות',90,'day',1],
  ['מענה לשאלות חוזרות',60,'day',3],
  ['עדכון CRM',45,'day',3],
  ['תיאום פגישות ביומן',60,'day',5],
  ['הפקת דוחות חודשיים',120,'month',1],
  ['מעקב אחרי תשלומים',45,'day',1],
  ['קליטת עובד חדש',180,'week',0],
  ['העברת נתונים בין מערכות',60,'day',2]
];

const DISCOVERY = [
  'מה עשית אתמול שתעשה גם מחר בדיוק באותה צורה?',
  'מה אתה מעתיק ממקום אחד למקום אחר: ממייל לטבלה, מטבלה למערכת?',
  'על מה אתה מחכה לאחרים כדי להמשיך לעבוד?',
  'איזו שאלה אתה עונה עליה שוב ושוב?',
  'מה אתה בודק או מתקן ידנית, כי אין לך אמון במה שהגיע?',
  'איזו משימה היית שמח שתיעלם מחר בבוקר?'
];

const DREAM_CHIPS = ['פרויקט חדש שמחכה','פיתוח מקצועי לצוות','שירות טוב יותר ללקוחות','צמיחה ולקוחות חדשים','זמן לחשוב ולתכנן','פחות שעות נוספות'];

/* ============================================================
   2. MODEL + VALIDATION
   ============================================================ */
const LIMITS = {minutes:[0,1440], people:[1,999], names:120, groups:60, tasks:300};

function uid(p){ return p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }
function clamp(n, lo, hi){ n = Number(n); if(!Number.isFinite(n)) return lo; return Math.min(hi, Math.max(lo, n)); }
function str(s, max){ return (typeof s === 'string' ? s : '').slice(0, max); }

function emptyState(){ return { v:2, groups:[], dream:{chips:[], text:''} }; }
function newGroup(name){
  return { id:uid('g'), name:name || 'הצוות שלי', people:1, tasks:[] };
}
function newTask(name, minutes, freq, dom){
  return { id:uid('t'), name:name||'', minutes:minutes||0, freq:freq||'day',
           auto:0.7, on:true, dom:(typeof dom === 'number' ? dom : null) };
}
/* A task's icon follows its domain. A name typed by hand is matched against the
   catalog once, on the way in, so the list still looks sorted without asking. */
function domainOf(name){
  const n = String(name || '').trim();
  if(!n) return null;
  for(let i=0; i<CATALOG.length; i++)
    for(const r of CATALOG[i].roles)
      for(const t of r.tasks)
        if(t[0] === n || t[0].indexOf(n) === 0 || n.indexOf(t[0]) === 0) return i;
  return null;
}
function domainMeta(i){
  return (typeof i === 'number' && DOMAINS[i]) ? DOMAINS[i] : DOMAIN_FALLBACK;
}

function ensureGroup(){
  if(!state.groups.length) state.groups.push(newGroup('הצוות שלי'));
  return state.groups[0];
}
function allTasks(){
  const out = [];
  for(const g of state.groups) for(const t of g.tasks) out.push({t, g});
  return out;
}
function findTask(id){
  for(const g of state.groups) for(const t of g.tasks) if(t.id === id) return {t, g};
  return null;
}
function findGroup(id){ return state.groups.filter(g => g.id === id)[0] || null; }

/* Validation never throws. Anything unknown is clamped or defaulted. */
function sanitize(raw){
  if(!raw || typeof raw !== 'object') return null;
  const seen = new Set();
  const s = emptyState();
  const groups = Array.isArray(raw.groups) ? raw.groups.slice(0, LIMITS.groups) : [];
  let taskCount = 0;
  for(const rg of groups){
    if(!rg || typeof rg !== 'object') continue;
    const g = newGroup(str(rg.name, LIMITS.names) || 'הצוות שלי');
    while(seen.has(g.id)) g.id = uid('g');
    seen.add(g.id);
    g.people = Math.round(clamp(rg.people, LIMITS.people[0], LIMITS.people[1]));
    const tasks = Array.isArray(rg.tasks) ? rg.tasks : [];
    for(const rt of tasks){
      if(!rt || typeof rt !== 'object') continue;
      if(taskCount >= LIMITS.tasks) break;
      const t = newTask(str(rt.name, LIMITS.names), 0, 'day', null);
      while(seen.has(t.id)) t.id = uid('t');
      seen.add(t.id);
      t.minutes = Math.round(clamp(rt.minutes, LIMITS.minutes[0], LIMITS.minutes[1]));
      t.freq = FREQS.includes(rt.freq) ? rt.freq : 'day';
      t.auto = AUTOS.includes(Number(rt.auto)) ? Number(rt.auto) : 0.7;
      t.on = rt.on !== false;                      // older links have no flag: everything counts
      t.dom = (Number.isInteger(rt.dom) && DOMAINS[rt.dom]) ? rt.dom : domainOf(t.name);
      g.tasks.push(t); taskCount++;
    }
    s.groups.push(g);
  }
  const chips = Array.isArray(raw.dream && raw.dream.chips) ? raw.dream.chips : [];
  s.dream.chips = chips.filter(c => DREAM_CHIPS.includes(c)).slice(0, DREAM_CHIPS.length);
  s.dream.text = str(raw.dream && raw.dream.text, 400);
  return s;
}

/* ============================================================
   3. COMPUTE — one pure function, nothing derived is ever stored
   ============================================================ */
function freqFactor(f){
  return f === 'day' ? DAYS_MONTH : f === 'week' ? WEEKS_MONTH : f === 'month' ? 1 : 1/3;
}
/* Largest-remainder rounding: the displayed rows sum EXACTLY to the displayed total. */
function allocate(values, target){
  const floors = values.map(v => Math.floor(v));
  const out = floors.slice();
  let rem = target - floors.reduce((a,b) => a+b, 0);
  const order = values
    .map((v,i) => ({i, frac: v - Math.floor(v)}))
    .sort((a,b) => b.frac - a.frac || a.i - b.i);
  for(let k=0; k<order.length && rem>0; k++){ out[order[k].i]++; rem--; }
  for(let k=order.length-1; k>=0 && rem<0; k--){ if(out[order[k].i] > 0){ out[order[k].i]--; rem++; } }
  return out;
}
function compute(s){
  const rows = [];
  for(const g of s.groups){
    for(const t of g.tasks){
      const hours = (t.minutes/60) * freqFactor(t.freq) * g.people;
      rows.push({
        id:t.id, groupId:g.id, groupName:g.name, name:t.name, people:g.people,
        minutes:t.minutes, freq:t.freq, auto:t.auto, dom:t.dom, on:t.on !== false,
        hoursMonth:hours, freedMonth:hours * t.auto
      });
    }
  }
  /* Only the ticked rows are in the cart. An unticked row still shows its own
     number, in grey, outside the sum — so nobody has to guess why the total moved. */
  const live = rows.filter(r => r.on && r.minutes > 0);
  const exactFreed = live.reduce((a,r) => a + r.freedMonth, 0);
  const exactToday = live.reduce((a,r) => a + r.hoursMonth, 0);
  /* Under ten hours a whole-number list lies twice: a real task reads "0 ש׳", and
     two identical tasks come out 1 and 0 because the leftover hour has to land on
     one of them. Below that line the list counts in tenths. */
  const step = exactFreed > 0 && exactFreed < 10 ? 10 : 1;
  const target = Math.round(exactFreed * step);
  const totalShown = target / step;
  const shown = allocate(live.map(r => r.freedMonth * step), target);
  live.forEach((r,i) => { r.freedShown = shown[i] / step; });
  rows.forEach(r => {
    if(r.freedShown === undefined)
      r.freedShown = Math.round(r.freedMonth * step) / step;
  });

  const byGroup = [];
  for(const g of s.groups){
    const mine = live.filter(r => r.groupId === g.id);
    if(!mine.length) continue;
    byGroup.push({id:g.id, name:g.name, people:g.people,
                  freed:mine.reduce((a,r) => a + r.freedMonth, 0)});
  }
  byGroup.sort((a,b) => b.freed - a.freed);

  return {
    rows, live,
    totals:{
      hoursToday: exactToday,
      freedMonthExact: exactFreed,
      freedMonth: totalShown,
      freedYear: Math.round(exactFreed * 12),
      fte: exactFreed / FTE_MONTH
    },
    byGroup,
    dream:{chips:s.dream.chips.slice(), text:s.dream.text}
  };
}

/* ============================================================
   4. PERSIST / ENCODE / MIGRATE
   ============================================================ */
const LS_KEY = 'waives.stones.v1';

function b64urlEncode(text){
  const bytes = new TextEncoder().encode(text);      // Hebrew would break btoa() directly
  let bin = '';
  for(let i=0; i<bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(s){
  let t = String(s).replace(/-/g,'+').replace(/_/g,'/');
  while(t.length % 4) t += '=';
  const bin = atob(t);
  const bytes = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* Compact NAMED keys — adding a field never shifts the meaning of the others. */
function pack(s){
  return {
    v:2,
    g:s.groups.map(g => ({
      n:g.name, p:g.people,
      t:g.tasks.map(t => ({
        n:t.name, m:t.minutes, f:FREQS.indexOf(t.freq), a:AUTOS.indexOf(t.auto),
        o:t.on === false ? 0 : 1, dm:(typeof t.dom === 'number' ? t.dom : -1)
      }))
    })),
    dc:s.dream.chips, dt:s.dream.text
  };
}
function unpack(o){
  if(!o || typeof o !== 'object') return null;
  return migrate({
    v:o.v,
    groups:Array.isArray(o.g) ? o.g.map(g => ({
      name:g && g.n, people:g && g.p,
      tasks:Array.isArray(g && g.t) ? g.t.map(t => ({
        name:t && t.n, minutes:t && t.m,
        freq:FREQS[t && t.f], auto:AUTOS[t && t.a],
        on:!(t && t.o === 0),
        dom:(t && Number.isInteger(t.dm) && t.dm >= 0) ? t.dm : null
      })) : []
    })) : [],
    dream:{chips:o.dc, text:o.dt}
  });
}
/* Kept forever: every past shape must still open. v1 links carry no `o` and no
   `dm`; unpack already defaults those, so a v1 payload simply flows through. */
function migrate(obj){
  if(!obj || typeof obj !== 'object') return null;
  return obj;
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(pack(state))); }catch(e){ /* private mode */ }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    return sanitize(unpack(JSON.parse(raw)));
  }catch(e){ return null; }
}
function readHash(){
  const m = /[#&]s=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
  if(!m) return null;
  try{ return sanitize(unpack(JSON.parse(b64urlDecode(m[1])))); }
  catch(e){ return 'bad'; }
}
function shareUrl(){
  return location.origin + location.pathname + '#s=' + b64urlEncode(JSON.stringify(pack(state)));
}

function fmtMinutes(m){
  if(m < 60) return m + ' דק׳';
  const h = m/60;
  return (Number.isInteger(h) ? h : h.toFixed(1).replace('.0','')) + ' ש׳';
}
function fmtHours(h){
  return nf(h) + ' ש׳';
}
/* The growth frame is never detached from the number. Percent below one
   position, "משרה ועוד 70%" above it — Galli's own wording, 2026-11-21. */
function freeText(fte){
  const pct = Math.max(0, Math.round(fte * 100));
  const full = Math.floor(pct / 100);
  const rem = pct - full * 100;
  if(full === 0) return rem + '% משרה פנוי למשימות חשובות אחרות';
  const head = full === 1 ? 'משרה' : nf(full) + ' משרות';
  if(rem === 0) return head + (full === 1 ? ' פנויה' : ' פנויות') + ' למשימות חשובות אחרות';
  return head + ' ועוד ' + rem + '% פנויים למשימות חשובות אחרות';
}

/* ---- positions: a person per whole position, a ring for the remainder ---- */
function fillPositions(wrap, fte, empty, size){
  wrap.textContent = '';
  const pct = Math.max(0, Math.round(fte * 100));
  const full = Math.floor(pct / 100);
  const rem = pct - full * 100;
  for(let i=0; i<Math.min(full,4); i++) wrap.appendChild(personSvg(size));
  if(full > 4) wrap.appendChild(el('span','posmore','+' + (full-4)));
  if(empty || rem > 0 || full === 0) wrap.appendChild(ringSvg(empty ? 0 : rem/100, empty ? '' : rem + '%', size));
}
function personSvg(size){
  const NS = 'http://www.w3.org/2000/svg';
  const s = size || 46;
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('width', s*0.72); svg.setAttribute('height', s);
  svg.setAttribute('viewBox','0 0 34 46');
  svg.setAttribute('aria-hidden','true');
  const head = document.createElementNS(NS,'circle');
  head.setAttribute('cx','17'); head.setAttribute('cy','12'); head.setAttribute('r','8.5');
  head.setAttribute('fill','var(--gold)');
  const body = document.createElementNS(NS,'path');
  body.setAttribute('d','M17 24c-8 0-14 5.2-14 12.4V44h28v-7.6C31 29.2 25 24 17 24Z');
  body.setAttribute('fill','var(--gold)');
  svg.appendChild(head); svg.appendChild(body);
  return svg;
}
function ringSvg(frac, centre, size){
  const NS = 'http://www.w3.org/2000/svg';
  const s = size || 46, r = s/2 - 5, c = 2*Math.PI*r;
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('width', s); svg.setAttribute('height', s);
  svg.setAttribute('viewBox','0 0 '+s+' '+s);
  svg.setAttribute('aria-hidden','true');
  const base = document.createElementNS(NS,'circle');
  base.setAttribute('cx',s/2); base.setAttribute('cy',s/2); base.setAttribute('r',r);
  base.setAttribute('fill','none'); base.setAttribute('stroke','rgba(255,255,255,.18)');
  base.setAttribute('stroke-width','5');
  svg.appendChild(base);
  if(frac > 0){
    const arc = document.createElementNS(NS,'circle');
    arc.setAttribute('cx',s/2); arc.setAttribute('cy',s/2); arc.setAttribute('r',r);
    arc.setAttribute('fill','none'); arc.setAttribute('stroke','var(--gold)');
    arc.setAttribute('stroke-width','5'); arc.setAttribute('stroke-linecap','round');
    arc.setAttribute('stroke-dasharray', (c*frac) + ' ' + c);
    arc.setAttribute('transform','rotate(-90 '+(s/2)+' '+(s/2)+')');
    svg.appendChild(arc);
  }
  if(centre){
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x',s/2); t.setAttribute('y',s/2);
    t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-size', Math.round(s*0.26));
    t.setAttribute('font-weight','800'); t.setAttribute('fill','#fff');
    t.setAttribute('font-family','Heebo, sans-serif');
    t.textContent = centre;
    svg.appendChild(t);
  }
  return svg;
}

function openSheet(id){

  ui.draft = f
    ? {name:f.t.name, minutes:f.t.minutes, freq:f.t.freq, auto:f.t.auto,
       dom:f.t.dom, on:f.t.on !== false, groupId:f.g.id}

       groupId:(state.groups[0] ? state.groups[0].id : null)};
  $('scrim').hidden = false;

  renderSheet(ui.draft);
  const inp = $('sheet').querySelector('input');

/* The draft is computed on its own, so the number at the top of the sheet moves on
   every press — the list screen is a list, but adding an item is still a calculator. */
function draftHours(d){
  const g = findGroup(d.groupId);
  const people = g ? g.people : 1;
  return (d.minutes/60) * freqFactor(d.freq) * people * d.auto;
}
function renderSheet(d){
  const sheet = $('sheet');
  const active = document.activeElement;
  const keep = active && sheet.contains(active) ? active.getAttribute('data-k') : null;
  const caret = (keep && active.selectionStart != null) ? active.selectionStart : null;
  sheet.textContent = '';

  const head = el('div','sheethead');
  const ht = el('div');
  ht.appendChild(el('div','t', ui.editId ? 'עדכון משימה' : 'משימה חדשה'));
  const hv = el('div','n');
  const hrs = draftHours(d);
  hv.appendChild(el('bdi', null, hrs > 0 && hrs < 10 ? nf(Math.round(hrs*10)/10) : nf(Math.round(hrs))));
  ht.appendChild(hv);
  ht.appendChild(el('div','u','שעות בחודש מהמשימה הזאת'));
  head.appendChild(ht);
  head.appendChild(el('span','grow')).style.flex = '1';
  const x = el('button','icobtn','✕');
  x.type = 'button'; x.id = 'sheetClose';
  x.setAttribute('aria-label','סגירה');
  x.addEventListener('click', closeSheet);
  head.appendChild(x);
  const hid = el('span','sr','משימה');
  hid.id = 'sheetTitle';
  head.appendChild(hid);
  sheet.appendChild(head);

  const body = el('div','sheetbody');

  /* 1 — what the task is. The free field is the main control: anything typed here
     becomes a task, whether or not it appears among the ready-made keys. */
  const q1 = el('div','q');
  const l1 = el('label', null, 'מה המשימה?');
  l1.setAttribute('for','fName');
  q1.appendChild(l1);
  const name = document.createElement('input');
  name.type = 'text'; name.className = 'field'; name.id = 'fName';
  name.setAttribute('data-k','name');
  name.placeholder = 'כתבו משימה, או בחרו מהרשימה';
  name.maxLength = LIMITS.names;
  name.value = d.name;
  name.addEventListener('input', () => {
    d.name = name.value.slice(0, LIMITS.names);
    const guess = domainOf(d.name);
    if(guess !== null) d.dom = guess;
    renderSheet(d);
  });
  q1.appendChild(name);
  const c1 = el('div','chips');
  c1.style.marginTop = '10px';
  QUICK.forEach(q => {
    const b = el('button','chip sm', q[0]);
    b.type = 'button';
    b.setAttribute('aria-pressed', d.name === q[0] ? 'true' : 'false');
    b.addEventListener('click', () => {
      d.name = q[0]; d.minutes = q[1]; d.freq = q[2]; d.dom = q[3];
      renderSheet(d);
    });
    c1.appendChild(b);
  });
  q1.appendChild(c1);
  body.appendChild(q1);

  /* 2 — how long it takes. The frequency is a button INSIDE the question, so the
     assumption is never hidden in a line underneath. */
  const q2 = el('div','q');
  const l2 = el('div','qlabel');
  l2.appendChild(document.createTextNode('כמה זמן היא לוקחת'));
  const fb = el('button','freqbtn', FREQ_ONCE[d.freq]);
  fb.type = 'button'; fb.id = 'fFreq';
  fb.setAttribute('aria-label','תדירות: ' + FREQ_ONCE[d.freq] + ', לשינוי');
  fb.addEventListener('click', () => {
    d.freq = FREQS[(FREQS.indexOf(d.freq) + 1) % FREQS.length];
    renderSheet(d);
  });
  l2.appendChild(fb);
  l2.appendChild(document.createTextNode('?'));
  q2.appendChild(l2);
  const c2 = el('div','chips');
  TIME_KEYS.forEach(m => {
    const b = el('button','chip', fmtMinutes(m));
    b.type = 'button';
    b.setAttribute('aria-pressed', d.minutes === m ? 'true' : 'false');
    b.addEventListener('click', () => { d.minutes = m; renderSheet(d); });
    c2.appendChild(b);
  });
  q2.appendChild(c2);
  const mins = document.createElement('input');
  mins.type = 'text'; mins.inputMode = 'numeric'; mins.className = 'field';
  mins.style.marginTop = '10px';
  mins.setAttribute('data-k','mins');
  mins.setAttribute('aria-label','מספר דקות');
  mins.placeholder = 'או מספר דקות משלכם';
  mins.value = d.minutes ? String(d.minutes) : '';
  mins.addEventListener('input', () => {
    d.minutes = Math.round(clamp(mins.value, LIMITS.minutes[0], LIMITS.minutes[1]));
    renderSheet(d);
  });
  q2.appendChild(mins);
  const g2 = findGroup(d.groupId);
  const weekly = (d.minutes/60) * freqFactor(d.freq) / WEEKS_MONTH;
  if(weekly > 42){
    q2.appendChild(el('p','hint warn','זה יותר מ-42 שעות בשבוע לאדם אחד. אולי מדובר בכמה אנשים — אפשר להגדיר את הצוות במסך "צוותים".'));
  }
  body.appendChild(q2);

  /* 3 — how much of it can run by itself. */
  const q3 = el('div','q');
  q3.appendChild(el('div','qlabel','כמה מזה אפשר להפוך לאוטומטי?'));
  const c3 = el('div','chips');
  AUTOS.slice().reverse().forEach(a => {
    const b = el('button','chip', AUTO_LABEL[a] + ' (' + Math.round(a*100) + '%)');
    b.type = 'button';
    b.setAttribute('aria-pressed', d.auto === a ? 'true' : 'false');
    b.addEventListener('click', () => { d.auto = a; renderSheet(d); });
    c3.appendChild(b);
  });
  q3.appendChild(c3);
  q3.appendChild(el('p','hint','הערכה. אפשר לשנות בכל רגע ולראות איך המספר זז.'));
  body.appendChild(q3);

  /* 4 — which team. Names only: the headcount lives on the teams screen. */
  const q4 = el('div','q');
  q4.appendChild(el('div','qlabel','לאיזה צוות המשימה שייכת?'));
  const c4 = el('div','chips');
  state.groups.forEach(g => {
    const b = el('button','chip sm', g.name);
    b.type = 'button';
    b.setAttribute('aria-pressed', d.groupId === g.id ? 'true' : 'false');
    b.addEventListener('click', () => { d.groupId = g.id; renderSheet(d); });
    c4.appendChild(b);
  });
  const nb = el('button','chip sm','+ צוות חדש');
  nb.type = 'button';
  nb.addEventListener('click', () => {
    const g = newGroup('צוות חדש');
    state.groups.push(g);
    d.groupId = g.id;
    save(); renderSheet(d);
  });
  c4.appendChild(nb);
  q4.appendChild(c4);
  if(g2 && g2.people > 1)
    q4.appendChild(el('p','hint','המשימה מוכפלת ב-' + g2.people + ' אנשים. את הכמות משנים במסך "צוותים".'));
  else
    q4.appendChild(el('p','hint','את מספר האנשים בכל צוות מגדירים פעם אחת, במסך "צוותים".'));
  body.appendChild(q4);

  sheet.appendChild(body);

  const foot = el('div','sheetfoot');
  if(ui.editId){
    const del = el('button','btn ghost','מחיקה');
    del.type = 'button'; del.id = 'sheetDelete';
    del.style.flex = '0 0 auto';
    del.addEventListener('click', () => { const id = ui.editId; closeSheet(); deleteTask(id); });
    foot.appendChild(del);
  }
  const ok = el('button','btn', ui.editId ? 'שמירה' : 'הוספה לרשימה');
  ok.type = 'button'; ok.id = 'sheetSave';
  ok.addEventListener('click', commitDraft);
  foot.appendChild(ok);
  sheet.appendChild(foot);

  if(keep){
    const again = sheet.querySelector('[data-k="' + keep + '"]');
    if(again){
      again.focus();
      if(caret != null && again.setSelectionRange){
        try{ again.setSelectionRange(caret, caret); }catch(e){}
      }
    }
  }
}
function commitDraft(){
  const d = ui.draft;
  if(!d) return;
  if(!d.name.trim() && !d.minutes){ closeSheet(); return; }
  const editId = ui.editId;
  closeSheet();
  apply(() => {
    let g = findGroup(d.groupId) || ensureGroup();
    if(editId){
      const f = findTask(editId);
      if(f){
        if(f.g.id !== g.id){
          f.g.tasks.splice(f.g.tasks.indexOf(f.t), 1);
          g.tasks.push(f.t);
        }
        f.t.name = d.name; f.t.minutes = d.minutes; f.t.freq = d.freq;
        f.t.auto = d.auto; f.t.dom = d.dom; f.t.on = d.on;
      }
    }else{
      if(allTasks().length >= LIMITS.tasks){ toast('הרשימה מלאה'); return; }
      const t = newTask(d.name, d.minutes, d.freq, d.dom);
      t.auto = d.auto;
      g.tasks.push(t);
    }
  });
  ui.screen = 'list';
  render();
}

/* ============================================================
   6. EVENTS
   ============================================================ */
/* Every mutation goes through here: mutate, persist, redraw. `quiet` skips the
   redraw for keystrokes inside a field the user is still typing in. */
function apply(fn, quiet){
  fn();
  save();
  if(!quiet) render();
}
function snapshot(){ return JSON.parse(JSON.stringify(pack(state))); }
function applyState(next, msg){
  const prev = snapshot();
  state = next;
  save(); render();
  offerUndo(msg, prev);
}
function toast(msg){
  $('snackText').textContent = msg;
  $('snackBtn').hidden = true;
  $('snack').hidden = false;
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => { $('snack').hidden = true; }, 3200);
}
function offerUndo(msg, prevPacked){
  undoSnapshot = prevPacked;
  $('snackText').textContent = msg;
  $('snackBtn').hidden = false;
  $('snack').hidden = false;
  clearTimeout(snackTimer);
  clearTimeout(undoTimer);
  snackTimer = setTimeout(() => { $('snack').hidden = true; }, 10000);
  undoTimer = setTimeout(() => { undoSnapshot = null; }, 10000);
}
function doUndo(){
  if(!undoSnapshot) return;
  const back = sanitize(unpack(undoSnapshot));
  undoSnapshot = null;
  $('snack').hidden = true;
  if(back){ state = back; save(); render(); }
}
function deleteTask(id){
  const prev = snapshot();
  apply(() => {
    for(const g of state.groups){
      const i = g.tasks.findIndex(t => t.id === id);
      if(i !== -1){ g.tasks.splice(i,1); break; }
    }
  });
  offerUndo('המשימה נמחקה', prev);
}
function deleteGroup(id){
  const prev = snapshot();
  apply(() => {
    const i = state.groups.findIndex(g => g.id === id);
    if(i === -1) return;
    const dead = state.groups.splice(i,1)[0];
    if(dead.tasks.length){
      const host = state.groups[0] || (state.groups.push(newGroup('הצוות שלי')), state.groups[0]);
      dead.tasks.forEach(t => host.tasks.push(t));
    }
  });
  offerUndo('הצוות נמחק, המשימות עברו לצוות הראשון', prev);
}
function loadDemo(){
  const prev = snapshot();
  const s = emptyState();
  const a = newGroup('רכזות גיוס'); a.people = 2;
  [['מיון קורות חיים',120,'day',0],
   ['תיאום ראיונות עם מועמדים ומראיינים',45,'day',0],
   ['שליחת עדכונים ותשובות למועמדים',30,'day',0]].forEach(x => {
    const t = newTask(x[0],x[1],x[2],x[3]); a.tasks.push(t);
  });
  const b = newGroup('מנהלת חשבונות'); b.people = 1;
  [['הקלדת חשבוניות ספקים',90,'day',1],
   ['גבייה ותזכורות ללקוחות',60,'day',1],
   ['התאמות בנק',180,'week',1]].forEach(x => {
    const t = newTask(x[0],x[1],x[2],x[3]); b.tasks.push(t);
  });
  const c = newGroup('נציגות שירות'); c.people = 3;
  [['מענה לשאלות חוזרות במייל ובוואטסאפ',120,'day',3],
   ['תיעוד פניות במערכת',45,'day',3],
   ['עדכון CRM אחרי פגישות ושיחות',45,'day',3],
   ['ניתוב פניות לגורם הנכון',30,'day',3]].forEach(x => {
    const t = newTask(x[0],x[1],x[2],x[3]); c.tasks.push(t);
  });
  s.groups.push(a,b,c);
  state = s;
  ui.screen = 'list';
  save(); render();
  offerUndo('נטען תרחיש לדוגמה', prev);
}
function resetAll(){
  const prev = snapshot();
  state = emptyState();
  ui.screen = 'list';
  save(); render();
  offerUndo('תרחיש חדש', prev);
}
function summaryText(){
  const res = compute(state);
  const lines = ['מחשבון האבנים הקטנות · WAIVES', ''];
  lines.push('סה״כ מתפנה בחודש: ' + nf(res.totals.freedMonth) + ' שעות');
  lines.push(freeText(res.totals.fte));
  lines.push(nf(res.totals.freedYear) + ' שעות בשנה');
  lines.push('');
  res.live.slice().sort((a,b) => b.freedMonth - a.freedMonth).forEach(r => {
    lines.push('· ' + (r.name || 'משימה ללא שם') + ' — ' + fmtHours(r.freedShown) + ' בחודש');
  });
  const dream = res.dream.chips.concat(res.dream.text ? [res.dream.text] : []).join(' · ');
  if(dream){ lines.push(''); lines.push('הזמן הזה הולך ל: ' + dream); }
  lines.push('');
  lines.push('משרה מלאה = ' + FTE_MONTH + ' שעות בחודש (' + DAYS_MONTH + ' ימי עבודה, יום של ' + DAY_HOURS + ' שעות).');
  return lines.join('\n');
}
let selfHash = false;
function doShare(){
  const url = shareUrl();
  if(url.length > 1900){
    doCopy();
    toast('התרחיש ארוך מדי לקישור, הסיכום הועתק במקום');
    return;
  }
  const nextHash = 's=' + url.split('#s=')[1];
  if(location.hash !== '#' + nextHash) selfHash = true;
  location.hash = nextHash;
  copyText(url, 'הקישור הועתק', 'הקישור בשורת הכתובת');
}
function doCopy(){ copyText(summaryText(), 'הסיכום הועתק', 'לא הצלחנו להעתיק'); }
function copyText(text, good, bad){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast(good), () => toast(bad));
  }else{
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:-1000px';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast(good);
    }catch(e){ toast(bad); }
  }
}

function go(screen){
  ui.screen = screen;
  closeMenu();
  render();
  window.scrollTo(0,0);
}
function closeMenu(){
  ui.menuOpen = false;
  $('menu').hidden = true;
  $('btnMenu').setAttribute('aria-expanded','false');
}
function buildMenu(){
  const m = $('menu');
  m.textContent = '';
  [['טעינת דוגמה', loadDemo],
   ['קישור לתרחיש', doShare],
   ['העתקת סיכום', doCopy],
   ['תרחיש חדש', resetAll]].forEach(([label, fn]) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.setAttribute('role','menuitem');
    b.addEventListener('click', () => { closeMenu(); fn(); });
    m.appendChild(b);
  });
}

$('btnNew').addEventListener('click', () => { closeMenu(); openSheet(null); });
$('btnMenu').addEventListener('click', () => {
  ui.menuOpen = !ui.menuOpen;
  $('menu').hidden = !ui.menuOpen;
  $('btnMenu').setAttribute('aria-expanded', ui.menuOpen ? 'true' : 'false');
});
document.addEventListener('click', ev => {
  if(!ui.menuOpen) return;
  if($('menu').contains(ev.target) || $('btnMenu').contains(ev.target)) return;
  closeMenu();
});
$('navList').addEventListener('click', () => go('list'));
$('navDash').addEventListener('click', () => go('dash'));
$('navTeams').addEventListener('click', () => go('teams'));
$('snackBtn').addEventListener('click', doUndo);
$('scrim').addEventListener('click', ev => { if(ev.target === $('scrim')) closeSheet(); });
document.addEventListener('keydown', ev => {
  if(ev.key !== 'Escape') return;
  if(ui.draft) closeSheet();
  else if(ui.menuOpen) closeMenu();
});

/* A shared link opened in a tab that is already on the page is a navigation the
   browser handles without reloading — the scenario must still load. */
window.addEventListener('hashchange', () => {
  if(selfHash){ selfHash = false; return; }
  const incoming = readHash();
  if(!incoming) return;
  if(incoming === 'bad'){ toast('הקישור לא נקרא, נפתח התרחיש שלך'); return; }
  const prev = snapshot();
  state = incoming;
  ui.screen = 'list';
  closeSheet();
  save(); render();
  offerUndo('נפתח תרחיש מקישור', prev);
});

/* ============================================================
   7. BOOT — the hash is validated before anything local is touched
   ============================================================ */
function boot(){
  buildMenu();
  const hash = readHash();
  const local = loadLocal();
  if(hash && hash !== 'bad'){
    state = hash;
    save(); render();
    if(local && local.groups.some(g => g.tasks.length))
      offerUndo('נפתח תרחיש מקישור', pack(local));
  }else{
    state = local || emptyState();
    render();
    if(hash === 'bad') toast('הקישור לא נקרא, נפתח התרחיש שלך');
  }
}
boot();

/* Exposed for the automated checks only. Nothing in the page reads this. */
window.__waives = {
  get state(){ return state; },
  get ui(){ return ui; },
  compute: () => compute(state),
  shareUrl, summaryText, sanitize, unpack, pack, b64urlEncode, b64urlDecode,
  freeText, FTE_MONTH, DAYS_MONTH, WEEKS_MONTH
};
</script>
